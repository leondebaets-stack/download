
<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn downloadwebsite</title>

    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .container {
            background: #1e293b;
            padding: 35px;
            border-radius: 16px;
            text-align: center;
            width: 85%;
            max-width: 400px;
        }

        h1 {
            color: #60a5fa;
        }

        p {
            color: #cbd5e1;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 22px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Mijn downloads</h1>
        <p>Klik op de knop om het testbestand te downloaden.</p>

        <a href="/download">
            <button>Download testbestand</button>
        </a>
    </div>
</body>
</html>
